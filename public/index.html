<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vida Positiva</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-logo">
      <span class="sun">☀️</span>
      <h1>Vida <span class="gold">Positiva</span></h1>
      <p class="tagline">Positividade Mental Diária</p>
    </div>

    <div id="login-form" class="auth-card">
      <h2>Entrar</h2>
      <form onsubmit="return doLogin(event)">
        <input type="email" id="login-email" placeholder="E-mail" required>
        <input type="password" id="login-pass" placeholder="Senha" required>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
      <p class="auth-switch">Não tem conta? <a href="#" onclick="showRegister()">Criar conta</a></p>
      <div id="login-error" class="error-msg"></div>
    </div>

    <div id="register-form" class="auth-card" style="display:none">
      <h2>Criar Conta</h2>
      <form onsubmit="return doRegister(event)">
        <input type="text" id="reg-name" placeholder="Seu nome" required>
        <input type="email" id="reg-email" placeholder="E-mail" required>
        <input type="password" id="reg-pass" placeholder="Senha (mín. 6 caracteres)" minlength="6" required>
        <button type="submit" class="btn-primary">Criar Conta</button>
      </form>
      <p class="auth-switch">Já tem conta? <a href="#" onclick="showLogin()">Entrar</a></p>
      <div id="reg-error" class="error-msg"></div>
    </div>
  </div>

  <script>
    function showRegister() {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('register-form').style.display = 'block';
    }
    function showLogin() {
      document.getElementById('register-form').style.display = 'none';
      document.getElementById('login-form').style.display = 'block';
    }

    async function doLogin(e) {
      e.preventDefault();
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('login-email').value,
          password: document.getElementById('login-pass').value
        })
      });
      const data = await res.json();
      if (data.ok) return window.location.href = '/app';
      document.getElementById('login-error').textContent = data.error;
    }

    async function doRegister(e) {
      e.preventDefault();
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('reg-name').value,
          email: document.getElementById('reg-email').value,
          password: document.getElementById('reg-pass').value
        })
      });
      const data = await res.json();
      if (data.ok) return window.location.href = '/app';
      document.getElementById('reg-error').textContent = data.error;
    }
  </script>
</body>
</html>
