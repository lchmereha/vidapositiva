<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vida Positiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
/* ─── CALENDAR + DATE NAV ADDITIONS ─── */
.date-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 0 8px}
.date-nav .date-label{font-size:.85rem;font-weight:500;color:var(--text);cursor:pointer;user-select:none;padding:6px 12px;border-radius:10px;transition:background .2s;text-align:center}
.date-nav .date-label:hover{background:var(--card)}
.date-nav .date-label .today-badge{font-size:.6rem;color:var(--acc);margin-left:6px;font-weight:600}
.date-arrow{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all .2s;flex-shrink:0}
.date-arrow:hover{background:var(--gold-dim,rgba(245,200,66,.15));border-color:var(--acc)}

/* Calendar Overlay */
.cal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.cal-overlay.open{display:flex}
.cal-popup{background:var(--bg);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius) var(--radius) 0 0;padding:20px;width:100%;max-width:400px;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.cal-header .cal-title{font-size:1rem;font-weight:600;text-transform:capitalize}
.cal-header .cal-close{background:none;border:none;color:var(--dim);cursor:pointer;font-size:1.2rem;padding:4px 8px}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav button{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--text);cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.cal-nav button:hover{background:rgba(245,200,66,.15)}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:8px}
.cal-weekdays span{text-align:center;font-size:.7rem;color:var(--dim);font-weight:600;padding:4px 0}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{position:relative;width:100%;aspect-ratio:1;border-radius:10px;border:none;background:transparent;color:var(--text);font-size:.85rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .15s}
.cal-day:hover{background:var(--card)}
.cal-day.other-month{color:var(--dim);opacity:.3}
.cal-day.today{border:2px solid var(--acc)}
.cal-day.selected{background:var(--acc);color:#08080d;font-weight:700}
.cal-day.selected .cal-dots span{background:#08080d}
.cal-dots{display:flex;gap:3px;position:absolute;bottom:3px}
.cal-dots span{width:4px;height:4px;border-radius:50%}
.cal-dots .dot-tasks{background:var(--acc)}
.cal-dots .dot-grat{background:var(--green)}
.cal-dots .dot-refl{background:var(--acc2)}
.cal-today-btn{margin-top:16px;width:100%;padding:10px;border:1px solid var(--acc);border-radius:10px;background:transparent;color:var(--acc);font-weight:600;font-size:.85rem;cursor:pointer;font-family:inherit}
.cal-today-btn:hover{background:rgba(245,200,66,.15)}
.readonly-banner{background:rgba(245,200,66,.08);border:1px solid rgba(245,200,66,.2);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:.8rem;color:var(--acc);text-align:center}
@media(min-width:600px){
  .cal-popup{border-radius:var(--radius);margin-bottom:20px}
  .cal-overlay{align-items:center}
}
</style>
</head>
<body>
<div class="app-shell">
  <!-- Header -->
  <div class="app-header">
    <div class="logo">☀️ Vida <span>Positiva</span></div>
    <button class="user-btn" onclick="doLogout()" title="Sair">🚪</button>
  </div>

  <!-- Date Navigation -->
  <div class="date-nav">
    <button class="date-arrow" onclick="navigateDate(-1)" title="Dia anterior">◀</button>
    <div class="date-label" id="date-label" onclick="openCalendar()">
      <span id="date-text"></span>
      <span class="today-badge" id="today-badge" style="display:none">Hoje</span>
    </div>
    <button class="date-arrow" onclick="navigateDate(1)" title="Próximo dia">▶</button>
  </div>

  <!-- Readonly Banner -->
  <div class="readonly-banner" id="readonly-banner" style="display:none">
    📖 Visualizando dia passado
  </div>

  <!-- Focus Banner -->
  <div class="focus-banner" id="focus-banner" style="display:none">
    <div class="focus-label">🎯 Seu foco de hoje</div>
    <div class="focus-text" id="focus-text"></div>
  </div>

  <!-- Gratitude Section -->
  <div class="section" id="sec-gratitude">
    <div class="section-header">
      <h2>🙏 Gratidão</h2>
      <span class="done-badge" id="grat-done" style="display:none">✓ Salvo</span>
    </div>
    <div class="grat-inputs">
      <span class="grat-num">1</span>
      <input type="text" id="g1" placeholder="Pela qual você é grata(o) hoje..." maxlength="280">
      <span class="grat-num">2</span>
      <input type="text" id="g2" placeholder="Outra coisa que te faz bem..." maxlength="280">
      <span class="grat-num">3</span>
      <input type="text" id="g3" placeholder="Mais uma... o que tem sido bom?" maxlength="280">
    </div>
  </div>

  <!-- Focus Section -->
  <div class="section" id="sec-focus">
    <div class="section-header">
      <h2>🎯 Foco do Dia</h2>
    </div>
    <input type="text" id="focus-input" class="focus-input" placeholder="Hoje estou focado(a) em..." maxlength="280">
  </div>

  <!-- Tasks Section -->
  <div class="section" id="sec-tasks">
    <div class="section-header">
      <h2>📋 Tarefas</h2>
      <span class="done-badge" id="tasks-count"></span>
    </div>
    <ul class="task-list" id="task-list"></ul>
    <div class="add-task-row">
      <input type="text" id="new-task" placeholder="Nova tarefa..." maxlength="200">
      <select id="new-priority">
        <option value="media">Média</option>
        <option value="alta">Alta</option>
        <option value="baixa">Baixa</option>
      </select>
      <button class="btn-add" onclick="addTask()">+</button>
    </div>
  </div>

  <!-- Evening Reflection -->
  <div class="section" id="sec-reflection">
    <div class="section-header">
      <h2>🌙 Reflexão Noturna</h2>
      <span class="done-badge" id="ref-done" style="display:none">✓ Salvo</span>
    </div>
    <div class="ref-stats" id="ref-stats"></div>
    <textarea id="extra-wins" rows="2" placeholder="Conquistas extras não planejadas..."></textarea>
    <textarea id="reflection-text" rows="3" placeholder="Reflexão do dia... como você se sente?"></textarea>
    <div class="mood-picker">
      <button class="mood-btn" data-mood="otimo" onclick="setMood(this)">😄</button>
      <button class="mood-btn" data-mood="bom" onclick="setMood(this)">😊</button>
      <button class="mood-btn selected" data-mood="neutro" onclick="setMood(this)">😐</button>
      <button class="mood-btn" data-mood="ruim" onclick="setMood(this)">😔</button>
      <button class="mood-btn" data-mood="pessimo" onclick="setMood(this)">😢</button>
    </div>
  </div>

  <!-- Save All Button -->
  <button class="btn-primary" style="margin-bottom:1.5rem" onclick="saveAll()">💾 Salvar Tudo</button>
  <div id="save-msg" style="text-align:center;color:var(--green);min-height:1.5rem;margin-top:0.5rem"></div>
</div>

<!-- Nav Bar -->
<nav class="nav-bar">
  <a href="/app" class="active"><span class="nav-icon">🏠</span>Hoje</a>
  <a href="/timeline"><span class="nav-icon">📖</span>Timeline</a>
</nav>

<!-- Calendar Overlay -->
<div class="cal-overlay" id="cal-overlay">
  <div class="cal-popup">
    <div class="cal-header">
      <button class="cal-close" onclick="closeCalendar()">✕</button>
      <div class="cal-nav">
        <button onclick="calNav(-1)">◀</button>
        <span class="cal-title" id="cal-title"></span>
        <button onclick="calNav(1)">▶</button>
      </div>
      <div style="width:32px"></div>
    </div>
    <div class="cal-weekdays">
      <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
    </div>
    <div class="cal-days" id="cal-days"></div>
    <button class="cal-today-btn" onclick="goToday()">Voltar para hoje</button>
  </div>
</div>

<script>
  let currentMood = 'neutro';
  let currentDate = new Date().toISOString().slice(0,10);
  let calendarMonth = new Date();
  let calendarData = {};

  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function fmtDate(s){
    const d=new Date(s+'T12:00:00');
    return d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  }

  /* ─── DATE NAV ─── */
  function updateDateLabel(){
    const isToday = currentDate === todayStr();
    document.getElementById('date-text').textContent = fmtDate(currentDate);
    document.getElementById('today-badge').style.display = isToday ? 'inline' : 'none';
    document.getElementById('readonly-banner').style.display = (currentDate < todayStr()) ? '' : 'none';
  }

  function navigateDate(delta){
    const d = new Date(currentDate+'T12:00:00');
    d.setDate(d.getDate()+delta);
    currentDate = d.toISOString().slice(0,10);
    updateDateLabel();
    loadDay();
    // Update calendar month if needed
    const newMonth = new Date(d.getFullYear(), d.getMonth(), 1);
    if(newMonth.getMonth()!==calendarMonth.getMonth()||newMonth.getFullYear()!==calendarMonth.getFullYear()){
      calendarMonth = newMonth;
      renderCalendar();
    }
  }

  function goToday(){
    currentDate = todayStr();
    updateDateLabel();
    loadDay();
    closeCalendar();
  }

  /* ─── CALENDAR ─── */
  async function loadCalendarData(){
    try {
      const res = await fetch(`/api/calendar?month=${calendarMonth.getFullYear()}-${String(calendarMonth.getMonth()+1).padStart(2,'0')}`);
      const data = await res.json();
      calendarData = {};
      (data.days||[]).forEach(d=>{ calendarData[d.date] = d; });
      renderCalendar();
    } catch(e){ /* offline or error */ }
  }

  function openCalendar(){
    calendarMonth = new Date(currentDate+'T12:00:00');
    loadCalendarData();
    document.getElementById('cal-overlay').classList.add('open');
  }
  function closeCalendar(){
    document.getElementById('cal-overlay').classList.remove('open');
  }
  document.getElementById('cal-overlay').addEventListener('click',e=>{
    if(e.target===e.currentTarget) closeCalendar();
  });

  function calNav(dir){
    calendarMonth.setMonth(calendarMonth.getMonth()+dir);
    loadCalendarData();
  }

  function renderCalendar(){
    const year = calendarMonth.getFullYear();
    const month = calendarMonth.getMonth();
    document.getElementById('cal-title').textContent = calendarMonth.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});

    const firstDay = new Date(year,month,1).getDay();
    const daysInMonth = new Date(year,month+1,0).getDate();
    const daysInPrev = new Date(year,month,0).getDate();

    const container = document.getElementById('cal-days');
    container.innerHTML = '';

    for(let i=firstDay-1;i>=0;i--){
      const btn = document.createElement('button');
      btn.className='cal-day other-month'; btn.textContent=daysInPrev-i; btn.disabled=true;
      container.appendChild(btn);
    }

    for(let d=1;d<=daysInMonth;d++){
      const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const btn=document.createElement('button');
      btn.className='cal-day'; btn.textContent=d;
      if(ds===todayStr()) btn.classList.add('today');
      if(ds===currentDate) btn.classList.add('selected');

      const info=calendarData[ds];
      if(info){
        const dots=document.createElement('div'); dots.className='cal-dots';
        if(info.has_gratitude) dots.innerHTML+='<span class="dot-grat"></span>';
        if(info.has_tasks) dots.innerHTML+='<span class="dot-tasks"></span>';
        if(info.has_reflection) dots.innerHTML+='<span class="dot-refl"></span>';
        btn.appendChild(dots);
      }
      btn.addEventListener('click',()=>{
        currentDate=ds; updateDateLabel(); loadDay(); closeCalendar();
      });
      container.appendChild(btn);
    }

    const totalCells=container.children.length;
    const remaining=(7-(totalCells%7))%7;
    for(let i=1;i<=remaining;i++){
      const btn=document.createElement('button');
      btn.className='cal-day other-month'; btn.textContent=i; btn.disabled=true;
      container.appendChild(btn);
    }
  }

  /* ─── LOAD DAY ─── */
  async function loadDay(){
    const [grat, foc, tasks, ref] = await Promise.all([
      fetch(`/api/gratitude/${currentDate}`).then(r=>r.json()),
      fetch(`/api/focus/${currentDate}`).then(r=>r.json()),
      fetch(`/api/tasks/${currentDate}`).then(r=>r.json()),
      fetch(`/api/reflection/${currentDate}`).then(r=>r.json())
    ]);

    if(grat){
      document.getElementById('g1').value=grat.item1||'';
      document.getElementById('g2').value=grat.item2||'';
      document.getElementById('g3').value=grat.item3||'';
      document.getElementById('grat-done').style.display='inline';
    } else {
      document.getElementById('g1').value='';
      document.getElementById('g2').value='';
      document.getElementById('g3').value='';
      document.getElementById('grat-done').style.display='none';
    }

    if(foc){
      document.getElementById('focus-input').value=foc.focus_text;
      document.getElementById('focus-banner').style.display='block';
      document.getElementById('focus-text').textContent=foc.focus_text;
    } else {
      document.getElementById('focus-input').value='';
      document.getElementById('focus-banner').style.display='none';
    }

    renderTasks(tasks);

    if(ref){
      document.getElementById('extra-wins').value=ref.extra_wins||'';
      document.getElementById('reflection-text').value=ref.reflection_text||'';
      setMoodByValue(ref.mood);
      document.getElementById('ref-done').style.display='inline';
    } else {
      document.getElementById('extra-wins').value='';
      document.getElementById('reflection-text').value='';
      setMoodByValue('neutro');
      document.getElementById('ref-done').style.display='none';
    }

    updateRefStats(tasks);
  }

  function renderTasks(tasks){
    const list=document.getElementById('task-list');
    const done=tasks.filter(t=>t.done).length;
    document.getElementById('tasks-count').textContent=`${done}/${tasks.length}`;
    if(!tasks.length){
      list.innerHTML='<div style="text-align:center;padding:24px;color:var(--dim);font-size:.85rem">📋 Nenhuma tarefa para este dia</div>';
      return;
    }
    list.innerHTML=tasks.map(t=>`
      <li class="task-item">
        <button class="task-check ${t.done?'done':''}" onclick="toggleTask(${t.id})">${t.done?'✓':''}</button>
        <span class="task-title ${t.done?'done':''}">${esc(t.title)}</span>
        <span class="task-priority ${t.priority}">${t.priority}</span>
        <button class="task-del" onclick="delTask(${t.id})">✕</button>
      </li>
    `).join('');
  }

  function updateRefStats(tasks){
    if(!tasks.length){document.getElementById('ref-stats').innerHTML='';return;}
    const done=tasks.filter(t=>t.done).length;
    document.getElementById('ref-stats').innerHTML=
      `Tarefas: <strong>${done}</strong> de <strong>${tasks.length}</strong> concluídas`;
  }

  async function addTask(){
    const input=document.getElementById('new-task');
    const title=input.value.trim();
    if(!title) return;
    const priority=document.getElementById('new-priority').value;
    await fetch('/api/tasks',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title,priority,date:currentDate})
    });
    input.value='';
    const tasks=await fetch(`/api/tasks/${currentDate}`).then(r=>r.json());
    renderTasks(tasks);
    updateRefStats(tasks);
    loadCalendarData(); // refresh dots
  }

  document.getElementById('new-task').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});

  async function toggleTask(id){
    await fetch(`/api/tasks/${id}/toggle`,{method:'PATCH'});
    const tasks=await fetch(`/api/tasks/${currentDate}`).then(r=>r.json());
    renderTasks(tasks);
    updateRefStats(tasks);
  }

  async function delTask(id){
    await fetch(`/api/tasks/${id}`,{method:'DELETE'});
    const tasks=await fetch(`/api/tasks/${currentDate}`).then(r=>r.json());
    renderTasks(tasks);
    updateRefStats(tasks);
    loadCalendarData();
  }

  function setMood(btn){
    document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    currentMood=btn.dataset.mood;
  }
  function setMoodByValue(val){
    currentMood=val||'neutro';
    document.querySelectorAll('.mood-btn').forEach(b=>{
      b.classList.toggle('selected',b.dataset.mood===currentMood);
    });
  }

  async function saveAll(){
    const msg=document.getElementById('save-msg');
    await Promise.all([
      fetch('/api/gratitude',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          item1:document.getElementById('g1').value,
          item2:document.getElementById('g2').value,
          item3:document.getElementById('g3').value,
          date:currentDate
        })
      }),
      fetch('/api/focus',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({focus_text:document.getElementById('focus-input').value,date:currentDate})
      }),
      fetch('/api/reflection',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          extra_wins:document.getElementById('extra-wins').value,
          reflection_text:document.getElementById('reflection-text').value,
          mood:currentMood,
          tasks_completed:parseInt(document.getElementById('tasks-count').textContent)||0,
          tasks_total:parseInt(document.getElementById('tasks-count').textContent.split('/')[1])||0,
          date:currentDate
        })
      })
    ]);

    msg.textContent='✨ Tudo salvo!';
    setTimeout(()=>msg.textContent='',3000);

    const foc=await fetch(`/api/focus/${currentDate}`).then(r=>r.json());
    if(foc){
      document.getElementById('focus-banner').style.display='block';
      document.getElementById('focus-text').textContent=foc.focus_text;
    }
    document.getElementById('grat-done').style.display='inline';
    document.getElementById('ref-done').style.display='inline';
    loadCalendarData();
  }

  async function doLogout(){
    await fetch('/api/auth/logout',{method:'POST'});
    window.location.href='/';
  }

  function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

  /* ─── KEYBOARD SHORTCUTS ─── */
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
    if(e.key==='ArrowLeft') navigateDate(-1);
    if(e.key==='ArrowRight') navigateDate(1);
    if(e.key==='t'||e.key==='T') goToday();
  });

  /* ─── INIT ─── */
  updateDateLabel();
  loadDay();
</script>
</body>
</html>
